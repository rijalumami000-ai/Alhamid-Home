version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alhamid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-alhamid_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-alhamid_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alhamid_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8088
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-alhamid_db}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-alhamid-super-secret-key-2026}
      UPLOAD_DIR: /app/uploads
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8088:8088"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alhamid_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:8088/api
    ports:
      - "5173:3000"

volumes:
  postgres_data:
  backend_uploads:

