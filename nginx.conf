# Konfigurasi Nginx untuk alhamidcintamulya.com
# Lokasi file di VPS: /etc/nginx/sites-available/alhamidcintamulya.com

server {
    listen 80;
    server_name alhamidcintamulya.com www.alhamidcintamulya.com;

    # Client Upload Limit
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Log files
    access_log /var/log/nginx/alhamid_access.log;
    error_log /var/log/nginx/alhamid_error.log;

    # Static Uploads (Foto, Brosur, Galeri) langsung dilayani Nginx
    location /uploads/ {
        alias /var/www/alhamidcintamulya.com/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Backend API Golang (Port 8088)
    location /api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Frontend SvelteKit (Node.js via PM2 Port 3005)
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
